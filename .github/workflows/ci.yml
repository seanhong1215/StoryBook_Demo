name: CI

on:
  push:
    branches: [master, feature]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消還在跑的舊 run —— private repo 的 Actions 分鐘數是計量的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      # a11y 檢查在 preview.tsx 設為 'error'，這一步等同 a11y 迴歸測試
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Test (92 stories, a11y enforced)
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      # private repo 無法用 GitHub Pages 做「只給內部看」的站台
      # （免費/Pro 方案的 Pages 一律公開）。改成上傳 artifact：
      # 有 repo 權限的人才下載得到，權限直接沿用 GitHub 的存取控制。
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: storybook-static
          retention-days: 14

  # 驗證「打包出來的東西真的裝得起來」——
  # 這一步抓的是 files / exports / sideEffects 設定錯誤，
  # 那類問題在 repo 內部怎麼測都測不出來。
  # 驗證「當前代碼打包後，全新消費端裝得起來、型別解析得到」。
  # 刻意不用 demo —— demo 現在裝的是 registry 上的正式版本（示範同事的接入
  # 方式），從 registry 裝需要認證、且測的是已發布版本而非這個 PR 的代碼。
  # verify:pack 自建臨時消費端測當前 tgz，與 demo 完全解耦。
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify packed tarball installs in a fresh consumer
        run: npm run verify:pack

      # 會在「只 import 一個元件卻拉進超過一半的 library」時失敗，
      # 擋下讓 tree-shaking 失效的改動（例如又在 entry 無條件 import CSS）
      - name: Measure what a single-component consumer actually bundles
        run: npm run measure:bundle
